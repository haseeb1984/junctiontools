name: Final Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Core release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring, openssl, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Core release quality checks
        shell: bash
        run: |
          set -euo pipefail
          php tests/validate-tool-factory-pipeline.php
          php tests/validate-tool-specs.php
          php tests/validate-demand-refresh.php
          php tests/validate-demand-routing.php
          php tests/validate-capability-demand-routing.php
          php tests/validate-build-security-gate-generator.php
          php tests/validate-approved-tool-generator.php
          php tests/validate-generated-runtime.php
          php tests/validate-ssrf-hardening.php
          php tools/validate-tool-content-seo.php
          php tests/validate-adsense-integration.php
          php tests/validate-site-navigation-sync.php
          php tests/validate-enhancement-deployment-plan.php
          php -r '
          $p=json_decode(file_get_contents("config/tool-generation-approvals.json"), true);
          if (($p["policy"]["human_approval_required_for_generation"] ?? true) !== false) exit(1);
          if (($p["policy"]["publication_requires_separate_human_review"] ?? false) !== true) exit(1);
          if (($p["policy"]["automatic_production_publish"] ?? true) !== false) exit(1);
          echo "Generation is automatic after Security Gate; production publication remains human-gated.\n";
          '
          echo "Core release quality gate: PASS"
