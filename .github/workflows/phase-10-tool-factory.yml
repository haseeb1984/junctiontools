name: Phase 10 Continuous Tool Factory

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - phase-10/continuous-tool-factory
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-factory-contract:
    name: Tool factory contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax checks
        run: |
          php -l tools/run-tool-factory.php
          php -l tools/run-demand-refresh.php
          php -l tools/build-tool-specs.php
          php -l tools/build-generation-queue.php
          php -l tools/generate-approved-tools.php
          php -l security/build-security-gate.php
          php -l security/adsense-compliance-gate.php
          php -l tests/validate-build-security-gate-generator.php
          php -l tools/sync-site-navigation.php
          php -l tools/build-search-console-feedback.php
          php -l tools/build-search-console-generation-queue.php
          php -l tools/evaluate-automatic-publishing.php
          php -l tools/build-deployment-plan.php
          php -l tools/build-enhancement-deployment-plan.php
          php -l tools/apply-approved-tool-enhancements.php
          php -l tests/validate-tool-factory-pipeline.php
          php -l tests/validate-demand-refresh.php
          php -l tests/validate-tool-factory-e2e.php
          php -l tests/validate-tool-factory-production-e2e.php
          php -l tests/validate-tool-specs.php
          php -l tests/validate-demand-routing.php
          php -l tests/validate-capability-demand-routing.php
          php -l tests/validate-tool-enhancement-spec.php
          php -l tests/validate-generated-runtime.php
          php -l tests/validate-site-navigation-sync.php
          php -l tests/validate-adsense-integration.php
          php -l tests/validate-tool-enhancement-approval.php
          php -l tests/validate-enhancement-deployment-plan.php
          php -l tests/validate-approved-tool-enhancement-staging.php

      - name: Validate Phase 10 pipeline contract
        run: php tests/validate-tool-factory-pipeline.php

      - name: Validate tool specification content contract
        run: php tests/validate-tool-specs.php

      - name: Validate pre-build Security Gate and generator enforcement
        run: php tests/validate-build-security-gate-generator.php

      - name: Validate generated tool layout and content order
        run: php tests/validate-generated-runtime.php

      - name: Validate site navigation synchronization contract
        run: php tests/validate-site-navigation-sync.php

      - name: Validate AdSense integration contract
        run: php tests/validate-adsense-integration.php

      - name: Validate demand refresh chain
        run: php tests/validate-demand-refresh.php

      - name: Validate existing-tool demand routes to SEO enhancement
        run: php tests/validate-demand-routing.php

      - name: Validate capability-first demand routing
        run: php tests/validate-capability-demand-routing.php

      - name: Validate existing-tool enhancement specification contract
        run: php tests/validate-tool-enhancement-spec.php

      - name: Validate full factory dry-run
        run: php tests/validate-tool-factory-e2e.php

      - name: Validate production-like Tool Factory E2E
        env:
          JT_E2E_KEEP_WORKSPACE: '1'
        run: php tests/validate-tool-factory-production-e2e.php

      - name: Install Playwright for browser runtime E2E
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium for browser runtime E2E
        run: npx playwright@1.55.0 install --with-deps chromium

      - name: Validate generated tool in a real browser
        run: node tests/validate-tool-factory-browser-e2e.js

      - name: Validate approved image resizer enhancement
        run: php tests/validate-tool-enhancement-approval.php

      - name: Validate approved existing-tool SEO enhancement staging
        run: php tests/validate-approved-tool-enhancement-staging.php

      - name: Validate enhancement deployment plan
        run: php tests/validate-enhancement-deployment-plan.php

      - name: Verify production publishing remains disabled
        run: |
          php -r '$p=json_decode(file_get_contents("config/tool-factory-pipeline.json"), true); if (($p["automatic_production_publish"] ?? true) !== false) { exit(1); } echo "Production publishing: disabled\n";'

      - name: Verify no credentials are committed
        run: |
          ! grep -RniE 'client_secret|refresh_token|authorization: bearer|developer_token' tools config tests --exclude-dir=.git
