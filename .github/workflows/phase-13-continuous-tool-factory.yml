name: Phase 13 Continuous Automated Tool Factory

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      demand_file:
        description: 'Demand registry JSON already available in the repository'
        required: true
        default: 'config/search-demand.json'
  push:
    branches: [main]
    paths:
      - 'config/tool-generation-approvals.json'
      - 'config/tool-enhancement-approvals.json'
      - 'tools/run-continuous-tool-factory.php'
      - 'tools/fetch-google-keyword-planner-demand.php'
      - 'config/google-keyword-planner-runtime.json'
      - 'tools/fetch-google-trends-demand.php'
      - 'tools/merge-demand-signals.php'
      - 'config/google-trends-runtime.json'
      - 'tools/apply-approved-tool-enhancements.php'
      - '.github/workflows/phase-13-continuous-tool-factory.yml'

permissions:
  contents: read

jobs:
  discover-and-security-gate:
    name: Discover, route, specify and security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Acquire live Google Trends demand
        id: google-trends-demand
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tool-factory
          php tools/fetch-google-trends-demand.php             config/google-trends-runtime.json             artifacts/tool-factory/google-trends-live.json
          echo "file=artifacts/tool-factory/google-trends-live.json" >> "$GITHUB_OUTPUT"

      - name: Acquire optional Google Ads historical demand
        id: google-ads-demand
        shell: bash
        env:
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/tool-factory
          if [ -n "${GOOGLE_ADS_CUSTOMER_ID:-}" ] &&              [ -n "${GOOGLE_ADS_CLIENT_ID:-}" ] &&              [ -n "${GOOGLE_ADS_CLIENT_SECRET:-}" ] &&              [ -n "${GOOGLE_ADS_REFRESH_TOKEN:-}" ]; then
            php tools/fetch-google-keyword-planner-demand.php               config/google-keyword-planner-runtime.json               artifacts/tool-factory/google-ads-live.json
            echo "file=artifacts/tool-factory/google-ads-live.json" >> "$GITHUB_OUTPUT"
          else
            echo "Google Ads enrichment skipped: required Ads credentials are not all configured."
            echo "Trends remains the primary daily demand source."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Trends discovery with optional Ads enrichment
        id: merged-demand
        run: |
          set -euo pipefail
          php tools/merge-demand-signals.php             artifacts/tool-factory/google-trends-live.json             "${{ steps.google-ads-demand.outputs.file }}"             artifacts/tool-factory/daily-demand-input.json
          echo "file=artifacts/tool-factory/daily-demand-input.json" >> "$GITHUB_OUTPUT"

      - name: Resolve demand input
        id: input
        shell: bash
        env:
          INPUT_FILE: ${{ inputs.demand_file }}
          LIVE_FILE: ${{ steps.merged-demand.outputs.file }}
        run: |
          set -euo pipefail
          if [ -n "$LIVE_FILE" ] && [ -f "$LIVE_FILE" ]; then
            FILE="$LIVE_FILE"
          else
            FILE="${INPUT_FILE:-config/search-demand.json}"
          fi
          if [ ! -f "$FILE" ]; then
            echo "Demand input missing: $FILE"
            echo "Phase 13 requires real demand evidence; the workflow will not invent search volume."
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run continuous factory through Security Gate
        run: |
          mkdir -p artifacts/tool-factory
          php tools/run-continuous-tool-factory.php "${{ steps.input.outputs.file }}" artifacts/tool-factory/workspace

      - name: Validate daily demand provenance
        run: |
          set -euo pipefail
          php -r '
            $trends=json_decode(file_get_contents("artifacts/tool-factory/google-trends-live.json"), true);
            $merged=json_decode(file_get_contents("artifacts/tool-factory/daily-demand-input.json"), true);
            if (($trends["source"] ?? "") !== "google-trends-trending-now-rss") exit(1);
            if (count($trends["keywords"] ?? []) < 1) exit(1);
            if (($merged["source"] ?? "") !== "junctiontools-daily-demand-merge") exit(1);
            if (count($merged["keywords"] ?? []) < 1) exit(1);
            echo "Verified daily demand provenance: Trends primary discovery with optional Ads enrichment.\n";
          '

      - name: Upload factory queue for human review
        uses: actions/upload-artifact@v4
        with:
          name: phase13-tool-factory-${{ github.sha }}
          path: artifacts/tool-factory/workspace/
          retention-days: 14

  approved-build:
    name: Generate only explicitly approved candidates
    if: github.event_name == 'push'
    needs: discover-and-security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Acquire live Google Trends demand
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tool-factory
          php tools/fetch-google-trends-demand.php             config/google-trends-runtime.json             artifacts/tool-factory/google-trends-live.json

      - name: Acquire optional Google Ads historical demand
        id: google-ads-demand-approved
        shell: bash
        env:
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_ADS_CUSTOMER_ID:-}" ] &&              [ -n "${GOOGLE_ADS_CLIENT_ID:-}" ] &&              [ -n "${GOOGLE_ADS_CLIENT_SECRET:-}" ] &&              [ -n "${GOOGLE_ADS_REFRESH_TOKEN:-}" ]; then
            php tools/fetch-google-keyword-planner-demand.php               config/google-keyword-planner-runtime.json               artifacts/tool-factory/google-ads-live.json
            echo "file=artifacts/tool-factory/google-ads-live.json" >> "$GITHUB_OUTPUT"
          else
            echo "Google Ads enrichment skipped: required Ads credentials are not all configured."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge daily demand signals
        run: |
          set -euo pipefail
          php tools/merge-demand-signals.php             artifacts/tool-factory/google-trends-live.json             "${{ steps.google-ads-demand-approved.outputs.file }}"             artifacts/tool-factory/daily-demand-input.json

      - name: Re-run factory for the approved commit
        run: |
          mkdir -p artifacts/tool-factory
          php tools/run-continuous-tool-factory.php             artifacts/tool-factory/daily-demand-input.json             artifacts/tool-factory/workspace

      - name: Generate approved new tools
        run: |
          mkdir -p artifacts/generated-tools
          php tools/generate-approved-tools.php \
            artifacts/tool-factory/workspace/tool-specs.json \
            config/tool-generation-approvals.json \
            artifacts/generated-tools \
            config/build-security-gate.json \
            artifacts/tool-factory/workspace/security-decisions.json \
            config/tools.json

      - name: Stage explicitly approved existing-tool enhancements
        run: |
          mkdir -p artifacts/enhancements
          php tools/apply-approved-tool-enhancements.php \
            artifacts/tool-factory/workspace/tool-specs.json \
            config/tool-enhancement-approvals.json \
            artifacts/enhancements \
            config/build-security-gate.json \
            artifacts/tool-factory/workspace/security-decisions.json \
            config/tools.json

      - name: Verify generated output and production remains blocked
        run: |
          test ! -f artifacts/generated-tools/.production-publish
          php -r '$p=json_decode(file_get_contents("config/tool-factory-pipeline.json"), true); if (($p["automatic_production_publish"] ?? true) !== false) exit(1); echo "Production publication remains disabled.\n";'

      - name: Upload approved generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase13-approved-generation-${{ github.sha }}
          path: artifacts/generated-tools/
          if-no-files-found: ignore
          retention-days: 14
