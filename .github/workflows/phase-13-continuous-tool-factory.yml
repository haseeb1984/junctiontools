name: Phase 13 Continuous Automated Tool Factory

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      demand_file:
        description: 'Demand registry JSON already available in the repository'
        required: true
        default: 'config/search-demand.json'
  push:
    branches: [main]
    paths:
      - 'config/tool-generation-approvals.json'
      - 'config/tool-enhancement-approvals.json'
      - 'tools/run-continuous-tool-factory.php'
      - 'tools/fetch-google-keyword-planner-demand.php'
      - 'config/google-keyword-planner-runtime.json'

permissions:
  contents: read

jobs:
  discover-and-security-gate:
    name: Discover, route, specify and security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Resolve demand input
        id: input
        shell: bash
        env:
          INPUT_FILE: ${{ inputs.demand_file }}
        run: |
          set -euo pipefail
          FILE="${INPUT_FILE:-config/search-demand.json}"
          if [ ! -f "$FILE" ]; then
            echo "Demand input missing: $FILE"
            echo "Phase 13 requires real demand evidence; the workflow will not invent search volume."
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run continuous factory through Security Gate
        run: |
          mkdir -p artifacts/tool-factory
          php tools/run-continuous-tool-factory.php "${{ steps.input.outputs.file }}" artifacts/tool-factory/workspace

      - name: Validate live-demand provenance
        if: steps.google-demand.outputs.file != ''
        run: |
          set -euo pipefail
          php -r '
            $p=json_decode(file_get_contents("artifacts/tool-factory/google-keyword-planner-live.json"), true);
            if (($p["source"] ?? "") !== "google-ads-keyword-planner-api") exit(1);
            if (count($p["keywords"] ?? []) < 1) exit(1);
            echo "Verified live Google demand provenance and non-empty keyword set.\n";
          '

      - name: Upload factory queue for human review
        uses: actions/upload-artifact@v4
        with:
          name: phase13-tool-factory-${{ github.sha }}
          path: artifacts/tool-factory/workspace/
          retention-days: 14

  approved-build:
    name: Generate only explicitly approved candidates
    if: github.event_name == 'push'
    needs: discover-and-security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Re-run factory for the approved commit
        run: |
          mkdir -p artifacts/tool-factory
          php tools/run-continuous-tool-factory.php config/search-demand.json artifacts/tool-factory/workspace

      - name: Generate approved new tools
        run: |
          mkdir -p artifacts/generated-tools
          php tools/generate-approved-tools.php \
            artifacts/tool-factory/workspace/tool-specs.json \
            config/tool-generation-approvals.json \
            artifacts/generated-tools \
            config/build-security-gate.json \
            artifacts/tool-factory/workspace/security-decisions.json \
            config/tools.json

      - name: Stage explicitly approved existing-tool enhancements
        run: |
          mkdir -p artifacts/enhancements
          php tools/apply-approved-tool-enhancements.php \
            artifacts/tool-factory/workspace/tool-specs.json \
            config/tool-enhancement-approvals.json \
            artifacts/enhancements \
            config/build-security-gate.json \
            artifacts/tool-factory/workspace/security-decisions.json \
            config/tools.json

      - name: Verify generated output and production remains blocked
        run: |
          test ! -f artifacts/generated-tools/.production-publish
          php -r '$p=json_decode(file_get_contents("config/tool-factory-pipeline.json"), true); if (($p["automatic_production_publish"] ?? true) !== false) exit(1); echo "Production publication remains disabled.\n";'

      - name: Upload approved generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase13-approved-generation-${{ github.sha }}
          path: artifacts/generated-tools/
          if-no-files-found: ignore
          retention-days: 14
