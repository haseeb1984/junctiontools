name: Phase 8 Search Console Feedback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-console-feedback:
    name: Search Console feedback validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax checks
        run: |
          php -l tools/import-search-console.php
          php -l tools/build-search-console-feedback.php
          php -l tools/build-search-console-generation-queue.php
          php -l tests/validate-search-console.php
      - name: Validate Search Console feedback pipeline
        run: php tests/validate-search-console.php
      - name: Verify no Search Console credentials are committed
        run: |
          ! grep -RniE 'client_secret[[:space:]]*:[[:space:]]*[^[:space:]]|refresh_token[[:space:]]*:[[:space:]]*[^[:space:]]|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' tools config tests --exclude-dir=.git
