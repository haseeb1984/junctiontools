name: Phase 0 Security Hardening

on:
  push:
    branches:
      - security/phase-0-hardening

permissions:
  contents: write

jobs:
  harden-scanner:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden scanner endpoint
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scanner.php')
          text = p.read_text(encoding='utf-8')

          text = text.replace("ini_set('display_errors', '1');", "ini_set('display_errors', '0');")
          text = text.replace("ini_set('display_startup_errors', '1');", "ini_set('display_startup_errors', '0');")
          text = text.replace("error_reporting(E_ALL);", "error_reporting(0);")
          text = text.replace("CURLOPT_FOLLOWLOCATION, true", "CURLOPT_FOLLOWLOCATION, false")
          text = text.replace("CURLOPT_SSL_VERIFYPEER, false", "CURLOPT_SSL_VERIFYPEER, true")

          if "security/url-validator.php" not in text:
              marker = "header('Content-Type: application/json');"
              injection = r'''header('Content-Type: application/json');

require_once __DIR__ . '/security/url-validator.php';
require_once __DIR__ . '/security/rate-limit.php';

if (!jt_rate_limit('scanner-endpoint', 30, 60)) {
    http_response_code(429);
    echo json_encode(['success' => false, 'message' => 'Too many scan requests. Please try again shortly.']);
    exit;
}
'''
              text = text.replace(marker, injection, 1)

          validation_marker = "$scanType = isset($input['type']) ? trim($input['type']) : 'pixels';"
          if "SSRF protection" not in text:
              validation = r'''$scanType = isset($input['type']) ? trim($input['type']) : 'pixels';

// SSRF protection: validate every externally supplied URL before any scanner can fetch it.
// Redirect following is disabled below so a public URL cannot pivot to an internal address.
foreach (['url', 'store_url'] as $urlKey) {
    if (!empty($input[$urlKey])) {
        [$urlOk, $urlResult] = jt_validate_external_url(trim((string)$input[$urlKey]));
        if (!$urlOk) {
            http_response_code(400);
            echo json_encode(['success' => false, 'message' => $urlResult]);
            exit;
        }
    }
}

if ($scanType === 'ssl_audit') {
    $domainInput = isset($input['domain']) ? trim((string)$input['domain']) : trim((string)($input['url'] ?? ''));
    [$domainOk, $domainResult] = jt_validate_domain($domainInput);
    if (!$domainOk) {
        http_response_code(400);
        echo json_encode(['success' => false, 'message' => $domainResult]);
        exit;
    }
    $input['domain'] = $domainResult;
}
'''
              text = text.replace(validation_marker, validation, 1)

          text = text.replace(
              "CURLOPT_SSL_VERIFYPEER, true",
              "CURLOPT_SSL_VERIFYPEER, true,\n    CURLOPT_SSL_VERIFYHOST, 2,\n    CURLOPT_MAXFILESIZE, 5000000"
          )

          text = text.replace(
              '$g = stream_context_create(["ssl" => ["capture_peer_cert" => true]]);',
              '$g = stream_context_create(["ssl" => ["capture_peer_cert" => true, "verify_peer" => true, "verify_peer_name" => true, "peer_name" => $domain]]);'
          )

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit hardened scanner
        run: |
          git config user.name "junctiontools-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add scanner.php
          if git diff --cached --quiet; then
            echo "No scanner changes needed."
            exit 0
          fi
          git commit -m "security: harden scanner against SSRF and unsafe HTTP [skip ci]"
          git push origin "$BRANCH_NAME"

          # Triggered by a normal branch push; the generated commit uses [skip ci]
          # so the hardening job runs exactly once for each new scanner version.
