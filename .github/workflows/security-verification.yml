name: Phase 0 Security Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/phase-0-hardening, phase-3/search-demand-discovery, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
  JUNCTIONTOOLS_TEST_BASE_URL: http://127.0.0.1:8080
  JUNCTIONTOOLS_TEST_TIMEOUT: '12'
  JUNCTIONTOOLS_TEST_CONNECT_TIMEOUT: '5'
  JUNCTIONTOOLS_TEST_MAX_BYTES: '2097152'
  JUNCTIONTOOLS_DEBUG_CERT: '1'

jobs:
  php-static:
    name: PHP syntax and Composer validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, openssl, pdo, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' PHP_FILES < <(find . -path './vendor' -prune -o -path './.git' -prune -o -name '*.php' -print0)
          test "${#PHP_FILES[@]}" -gt 0
          for file in "${PHP_FILES[@]}"; do php -l "$file"; done
      - name: Validate Phase 1 tool registry
        run: php tests/validate-registry.php
      - name: Validate timestamp converter tool
        run: php tests/validate-timestamp-converter.php
      - name: Validate QR code generator tool
        run: php tests/validate-qr-code-generator.php
      - name: Validate age calculator tool
        run: php tests/validate-age-calculator.php
      - name: Validate image compressor enhancement
        run: php tests/validate-image-compressor-enhancement.php
      - name: Validate registry-driven sitemap
        run: php tests/validate-sitemap.php
      - name: Validate Phase 3 opportunity registry
        run: php tests/validate-opportunities.php
      - name: Validate Phase 3 search-demand registry
        run: php tests/validate-search-demand.php
      - name: Validate Phase 3 generation queue
        run: php tests/validate-generation-queue.php
      - name: Validate Google Keyword Planner importer
        run: php tests/validate-google-keyword-planner.php
      - name: Validate Google demand opportunity builder
        run: php tests/validate-google-demand-opportunities.php
      - name: Validate demand-to-generation queue builder
        run: php tests/validate-generation-queue-builder.php

  security-suite:
    name: Compatibility and security integration suite
    runs-on: ubuntu-latest
    needs: php-static
    timeout-minutes: 20
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, openssl, pdo, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Verify committed test and demand files
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/run.php tests/compatibility-fixture-suite.php tests/bootstrap.php tests/router.php tests/validate-registry.php tests/validate-timestamp-converter.php tests/validate-qr-code-generator.php tests/validate-age-calculator.php tests/validate-image-compressor-enhancement.php tests/validate-sitemap.php tests/validate-opportunities.php tests/validate-search-demand.php tests/validate-generation-queue.php tests/validate-google-keyword-planner.php tests/validate-google-demand-opportunities.php tests/validate-generation-queue-builder.php tools/generate-sitemap.php tools/import-google-keyword-planner.php tools/build-demand-opportunities.php tools/build-generation-queue.php; do test -f "$file"; done
          test -d tests/fixtures
      - name: Start local PHP server with committed fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          php -S 127.0.0.1:8080 tests/router.php > artifacts/php-server.log 2>&1 &
          echo $! > artifacts/php-server.pid
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$JUNCTIONTOOLS_TEST_BASE_URL/tests/fixtures/timeout.php?delay=0" >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          cat artifacts/php-server.log >&2 || true
          exit 1
      - name: Run 35-tool compatibility suite
        run: php tests/compatibility-fixture-suite.php
      - name: Run SSL issuer and expiry tests
        run: php tests/run.php --suite=ssl --report=artifacts/ssl.json
      - name: Run SSRF protection tests
        run: php tests/run.php --suite=ssrf --report=artifacts/ssrf.json
      - name: Run redirect-blocking tests
        run: php tests/run.php --suite=redirects --report=artifacts/redirects.json
      - name: Run timeout and response-size tests
        run: php tests/run.php --suite=limits --report=artifacts/limits.json --slow-url="$JUNCTIONTOOLS_TEST_BASE_URL/tests/fixtures/timeout.php?delay=10" --large-url="$JUNCTIONTOOLS_TEST_BASE_URL/tests/fixtures/large-response.php?bytes=3145728"
      - name: Run rate-limit tests
        run: php tests/run.php --suite=rate-limit --report=artifacts/rate-limit.json
      - name: Run HTTP method and security-header tests
        run: php tests/run.php --suite=http-security --report=artifacts/http-security.json
      - name: Upload security-suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-security-verification-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local PHP server
        if: always()
        run: if [ -f artifacts/php-server.pid ]; then kill "$(cat artifacts/php-server.pid)" 2>/dev/null || true; fi

  final-gate:
    name: Phase 0 verification gate
    runs-on: ubuntu-latest
    needs: [php-static, security-suite]
    if: always()
    steps:
      - name: Require all Phase 0 checks to pass
        run: |
          set -euo pipefail
          if [ "${{ needs.php-static.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.security-suite.result }}" != success ]; then exit 1; fi
          echo 'Phase 0 verification gate: PASS'
